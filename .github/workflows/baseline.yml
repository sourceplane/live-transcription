name: Baseline CI

# THE FACTORY'S OWN LANES — this repository tested as a BASELINE: that its
# build document parses with the orun a bootstrap actually runs, that its card
# agrees with it, that every component is placed by the one product phase,
# that a placed tree comes up branded and carrying nothing of the factory —
# and plans the app onto stage and prod on a merge — and that the app it
# produces installs, builds, deploys (dry) and transcribes on Workers AI
# with no key, and then mints an owner's Deepgram token (in-process stand-ins
# for both, since neither can be called offline).
#
# ─── WHY THIS IS NOT IN ci.yml ────────────────────────────────────────────
#
# `repo-blueprint.yaml`'s `github-workflows` module copies the WHOLE `.github`
# directory into every app built from this repository. These jobs run
# `testing/*.sh`, and `testing/` is deliberately not placed — so in a app they
# would be steps that cannot pass, red on its very first pull request. This
# file is in the blueprint's `ignore` list, and `testing/coverage.test.sh`
# fails on any workflow that reads `testing/` and is not.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: baseline-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Tier 0. bash, python3 and git; node for the tools. No workspace install,
  # no network, no credential — the job that most certainly fails a PR.
  baseline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # setup-node v5 turns on the pnpm cache by itself when package.json
          # names a packageManager, and then fails on a runner with no pnpm.
          # This job installs nothing.
          package-manager-cache: false
      - name: Contract tests (manifest, phases, coverage, rebrand, retouch, bootstrap-defer, render)
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          for t in manifest phases coverage rebrand retouch bootstrap-defer render; do
            echo "── $t"
            bash "testing/$t.test.sh"
          done
      # Every component's docs/{overview,architecture,runbook}.md is generated
      # from what the component declares (its manifest, Worker config,
      # Terraform, migrations, package scripts). A pull request that changes
      # one of those facts without regenerating the pages fails here.
      - name: Component docs match their manifests
        run: python3 tooling/catalog/gen-component-docs.py --check

  # Tier 1. THE BLUEPRINT, READ AND PLACED BY THE BINARY A BOOTSTRAP RUNS.
  #
  # Pinned at v2.96.0, not the app's lane pin: at or above the bootstrap
  # floor (v2.88.0, BOOTSTRAP.md), and the first orun that reads a
  # component's `spec.preview`, so the placement's `orun validate` checks the
  # app's live preview too. Every test here reads YAML with PyYAML, which
  # parses anything well-formed;
  # only the pinned orun can say whether the document is one a bootstrap can
  # run. `--status` parses it, validates every hook against the action
  # registry, compiles every `when` and narration template, and writes
  # nothing. Then the leak gate (what a product would carry, derived by the
  # floor too), and the placement tier (the offline bootstrap: both phases
  # placed and finished by the blueprint's own hooks, then the product's own
  # `orun plan` for the 01-product merge, below).
  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: sourceplane/orun-action@v1.2.0
        with:
          version: v2.96.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # This job installs nothing either: with no lockfile hook the offline
          # bootstrap never runs pnpm, so there is no store, and the pnpm cache
          # setup-node v5 turns on by itself (package.json names a packageManager)
          # fails the job saving a path that does not exist whenever no earlier
          # cache exists for the lockfile.
          package-manager-cache: false
      - name: repo-blueprint.yaml, read by the pinned CLI
        run: |
          set -euo pipefail
          orun --version
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          # Required inputs must be supplied for the document to resolve; the
          # values are arbitrary and nothing is written.
          orun new --blueprint repo-blueprint.yaml --status \
            --out "$(mktemp -d)" \
            --set reponame=acme-live \
            --set "productname=Acme Live" \
            --set githuborg=acme-inc
      - name: the leak gate — what a product carries
        run: bash testing/leak.test.sh
      # The placement tier ENDS with the product's own `orun plan` — what the
      # product's ci.yml runs — so it needs an orun at the product's lane pin
      # (v2.78.4) or newer: the plan a convergence waits on is the lane pin's
      # (its optional secret refs included), and the test refuses an orun
      # older than the pin rather than assert the wrong CLI's plan. The
      # offline bootstrap before it reads the blueprint, which takes the
      # bootstrap floor (v2.88.0: the one `secrets` reconcile, the task set-up
      # in the background, the landings checked in the box), so this tier
      # runs v2.96.0, at or above the floor and the first orun that reads
      # `spec.preview`, which is newer than the lane pin.
      - uses: sourceplane/orun-action@v1.2.0
        with:
          version: v2.96.0
      - name: placement — the offline bootstrap, and the product's own plan
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name "baseline ci"
          bash testing/placement.test.sh

  # Tier 2. THE APP IT PRODUCES WORKS, ON WORKERS AI AND WITH A DEEPGRAM KEY:
  # each landing installed, its fixture rendered, type-checked, linted, tested
  # and built, the stage lane's own structure check, build, output check and
  # dry deploy (Workers AI bound as AI) in the tree orun stages, and the built
  # Worker served and smoke-tested with the component's own smoke command —
  # the page under the product's name, a speech-like recording streamed over
  # the transcription socket and its captions sent back by an in-process
  # Workers AI, the page itself in headless Chrome captioning what Chrome's
  # fake microphone plays, the socket's refusals — then served again with an
  # owner's Deepgram key, a short-lived token minted by an in-process
  # Deepgram. Pinned at v2.96.0, above the bootstrap floor
  # (v2.88.0), the first orun that reads `spec.preview`: the offline bootstrap
  # reads the blueprint, and the pin is newer than the product's lane pin
  # (v2.78.4), which is all the lane steps need.
  transcription:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: sourceplane/orun-action@v1.2.0
        with:
          version: v2.96.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: e2e — the bootstrapped app builds, deploys (dry) and transcribes
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          git config --global user.email ci@example.invalid
          git config --global user.name "baseline ci"
          bash testing/e2e.test.sh
